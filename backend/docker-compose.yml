services:
  # =========================================================
  # 1. Backend (Laravel API + Nginx + WebSocket Hub + Queue Worker)
  # =========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.5"
    image: sticommande-backend:latest
    container_name: sticommande-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BACKEND_PORT:-8000}:80"
      - "${WS_PORT:-8085}:8085"
    environment:
      APP_NAME: "${APP_NAME:-StiCommande}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:Sm9obkRvZUlzQUZha2VLZXlGb3JUZXN0aW5nMTIzNDU=}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-sticommande_db}"
      DB_USERNAME: "${DB_USERNAME:-sticommande_user}"
      DB_PASSWORD: "${DB_PASSWORD:-changeme_secure_db_pass}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-changeme_secure_redis_pass}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      START_WEBSOCKET: "${START_WEBSOCKET:-true}"
      START_QUEUE_WORKER: "${START_QUEUE_WORKER:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web_net
      - internal_net
    volumes:
      - backend_storage:/var/www/commande/backend/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/up && curl -f http://localhost:8085/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # 2. Database (PostgreSQL 16)
  # =========================================================
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: sticommande-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-sticommande_db}"
      POSTGRES_USER: "${DB_USERNAME:-sticommande_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme_secure_db_pass}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sticommande_user} -d ${DB_DATABASE:-sticommande_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # 3. Cache & Message Broker (Redis 7)
  # =========================================================
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: sticommande-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme_secure_redis_pass}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_secure_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal_net:
    driver: bridge
  web_net:
    driver: bridge

volumes:
  backend_storage:
  postgres_data:
  redis_data:
