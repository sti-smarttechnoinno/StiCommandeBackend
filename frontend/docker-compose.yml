services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined into the client bundle at BUILD time,
        # not read at container runtime — they must be passed as build args,
        # not as `environment:` below. Set NEXT_PUBLIC_API_URL / _WS_URL in
        # your .env (or Jenkins --build-arg) before `docker compose build`.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-ws://localhost:8085}"
    image: sticommande-frontend:latest
    container_name: sticommande-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Bind to localhost so a reverse proxy (Nginx/Traefik/Cloudflare) fronts it,
      # same pattern as the backend service.
      - "127.0.0.1:3000:3000"
    environment:
      # Server-side runtime vars only (NOT the NEXT_PUBLIC_* client vars above)
      NODE_ENV: "production"
    networks:
      - web_net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web_net:
    driver: bridge