name: sti_commande
description: "STI Distribution - Mobile Delegate Dashboard"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_riverpod: ^2.6.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  percent_indicator: ^4.2.3
  gap: ^3.0.1
  flutter_svg: ^2.0.17
  go_router: ^14.8.1
  pdf: ^3.11.1
  printing: ^5.13.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

