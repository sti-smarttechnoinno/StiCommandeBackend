services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.5"
    image: sticommande-backend:latest
    container_name: sticommande-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Bind to localhost (127.0.0.1) so reverse proxy (Nginx/Traefik/Cloudflare) handles SSL/firewall
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8085:8085"
    environment:
      APP_NAME: "${APP_NAME:-StiCommande}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-sticommande_db}"
      DB_USERNAME: "${DB_USERNAME:-sticommande_user}"
      DB_PASSWORD: "${DB_PASSWORD:-changeme_secure_db_pass}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-changeme_secure_redis_pass}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      START_WEBSOCKET: "${START_WEBSOCKET:-true}"
      START_QUEUE_WORKER: "${START_QUEUE_WORKER:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web_net
      - internal_net
    volumes:
      - backend_storage:/var/www/commande/backend/storage
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: sticommande-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # NO ports exposed to host - database accessible ONLY through internal isolated network
    environment:
      POSTGRES_DB: "${DB_DATABASE:-sticommande}"
      POSTGRES_USER: "${DB_USERNAME:-sticommande_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme_secure_db_pass}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.20"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sticommande_user} -d ${DB_DATABASE:-sticommande}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sticommande-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Run Redis with authentication and disabled risky commands
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-changeme_secure_redis_pass}"
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    # NO ports exposed to host - redis accessible ONLY via internal isolated network
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_secure_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  web_net:
    driver: bridge
    # Network for public traffic ingress (reverse proxy to backend)
  internal_net:
    driver: bridge
    internal: true
    # Isolated network: Containers here (DB & Redis) cannot reach or be reached by the external internet

volumes:
  backend_storage:
    name: sticommande_backend_storage
  postgres_data:
    name: sticommande_postgres_data
  redis_data:
    name: sticommande_redis_data
