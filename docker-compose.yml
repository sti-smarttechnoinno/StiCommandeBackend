services:
  # =========================================================
  # 1. Reverse Proxy (Gateway for Frontend, API & WebSockets)
  # =========================================================
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: sticommande-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - web_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # 2. Frontend (Next.js Standalone)
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined into the client bundle at BUILD time,
        # not read at container runtime — must be build args, not environment:.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost/api}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-ws://localhost:8085}"
    image: sticommande-frontend:latest
    container_name: sticommande-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Direct access for debugging only — nginx gateway (port 80) is the
      # intended public entry point on the LAN.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: "production"
    networks:
      - web_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # 3. Backend (Laravel + PHP 8.5 + Nginx + Node WebSocket Hub + Queue Worker)
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.5"
    image: sticommande-backend:latest
    container_name: sticommande-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Direct access for debugging only — nginx gateway proxies to these
      # internally over web_net, so publishing to the host isn't required
      # for the gateway to work.
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8085:8085"
    environment:
      APP_NAME: "${APP_NAME:-StiCommande}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-sticommande_db}"
      DB_USERNAME: "${DB_USERNAME:-sticommande_user}"
      DB_PASSWORD: "${DB_PASSWORD:-changeme_secure_db_pass}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-changeme_secure_redis_pass}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      START_WEBSOCKET: "${START_WEBSOCKET:-true}"
      START_QUEUE_WORKER: "${START_QUEUE_WORKER:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web_net
      - internal_net
    volumes:
      - backend_storage:/var/www/commande/backend/storage
    healthcheck:
      # Checks both the Laravel app (port 80) and the websocket-server.js hub (port 8085)
      test: ["CMD-SHELL", "curl -f http://localhost/up && curl -f http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # 4. Database (PostgreSQL 16)
  # =========================================================
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: sticommande-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: "${DB_DATABASE:-sticommande_db}"
      POSTGRES_USER: "${DB_USERNAME:-sticommande_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme_secure_db_pass}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sticommande_user} -d ${DB_DATABASE:-sticommande_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================
  # 5. Cache & Queues (Redis 7)
  # =========================================================
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: sticommande-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-changeme_secure_redis_pass}"
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_secure_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web_net:
    name: sticommande_web_net
    driver: bridge
  internal_net:
    name: sticommande_internal_net
    driver: bridge
    internal: true

volumes:
  backend_storage:
    name: sticommande_backend_storage
  postgres_data:
    name: sticommande_postgres_data
  redis_data:
    name: sticommande_redis_data